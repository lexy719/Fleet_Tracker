<!doctype html>
<html>
<head>
<meta charset="utf-8" />
<link rel="stylesheet" href="base.css" />
<style>
  body { background: #ebe5d8; cursor: default; }
  .bgdots { position: absolute; inset: 0; background: radial-gradient(circle at 1px 1px, rgba(27,29,34,.06) 1px, transparent 0) 0 0 / 24px 24px, #ebe5d8; }
  .topb { position: absolute; top: 16px; left: 16px; right: 16px; height: 44px; display: flex; align-items: center; gap: 16px; padding: 0 8px 0 14px; z-index: 50; }
  .topb .clock { margin-left: 0; }
  .thing { position: absolute; overflow: hidden; border-radius: 20px; background: var(--paper); box-shadow: var(--shadow); cursor: pointer; will-change: left, top, width, height; }
  .thing.pill { border-radius: 999px; }
  .thing .cnt { position: absolute; inset: 0; }
  .lv { position: absolute; inset: 0; padding: 16px 18px; display: flex; flex-direction: column; gap: 10px; }
  .lv.sig { padding: 0 12px; flex-direction: row; align-items: center; gap: 8px; font-size: 13px; white-space: nowrap; }
  .lv.sig b { font: 600 12px var(--mono); }
  .lv.sig i { width: 8px; height: 8px; border-radius: 50%; flex-shrink: 0; }
  .ttl { display: flex; align-items: baseline; gap: 8px; font-weight: 650; letter-spacing: -.02em; white-space: nowrap; }
  .ttl .n { font: 600 12px var(--mono); color: var(--ink-3); letter-spacing: 0; }
  .ttl .x { margin-left: auto; font: 500 11px var(--mono); color: var(--ink-3); }
  .r { display: flex; align-items: center; gap: 10px; padding: 9px 11px; border-radius: 12px; background: var(--paper-2); font-size: 13px; white-space: nowrap; overflow: hidden; }
  .r .k { font: 600 13px var(--mono); }
  .r .s { margin-left: auto; font: 500 12px var(--mono); color: var(--ink-3); }
  .grid { display: grid; gap: 12px; flex: 1; min-height: 0; align-content: start; grid-auto-rows: 150px; }
  .cell { border-radius: 16px; background: var(--paper-2); padding: 14px; overflow: hidden; display: flex; flex-direction: column; gap: 8px; }
  .bigN { font-weight: 650; letter-spacing: -.04em; line-height: 1; }
  .map { position: absolute; inset: 0; background-repeat: no-repeat; }
  .strip { position: absolute; left: 0; right: 0; top: 0; padding: 14px 18px; display: flex; align-items: baseline; gap: 10px; background: linear-gradient(var(--paper) 70%, rgba(246,242,234,0)); }
  .ov { position: absolute; inset: 0; pointer-events: none; }
  .help { position: absolute; left: 50%; bottom: 14px; translate: -50% 0; padding: 7px 14px; border-radius: 999px; background: var(--ink); color: var(--paper); font: 600 12.5px var(--sans); z-index: 60; white-space: nowrap; }
</style>
</head>
<body>
<div class="bgdots"></div>
<div class="topb"><span class="brand"><span class="mark"></span>FleetOS</span><span class="crumb" id="crumb">Operação</span></div>
<div id="stage"></div>
<div class="help" id="help"></div>
<script src="living.js"></script>
</body>
</html>
