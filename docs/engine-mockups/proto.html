<!doctype html>
<html>
<head>
<meta charset="utf-8" />
<link rel="stylesheet" href="base.css" />
<style>
  .maps { position: absolute; inset: 0; overflow: hidden; background: #aad3e8; }
  .maps img { position: absolute; inset: 0; width: 100%; height: 100%; object-fit: cover; transform-origin: 70% 40%; }
  .col { position: absolute; top: 76px; left: 16px; bottom: 16px; display: flex; flex-direction: column; gap: 10px; }
  .m { border-radius: 18px; overflow: hidden; position: relative; flex-shrink: 0; }
  .m .in { padding: 14px 16px; display: flex; flex-direction: column; gap: 8px; }
  .m h3 { margin: 0; display: flex; align-items: baseline; gap: 8px; font-weight: 650; letter-spacing: -0.02em; }
  .m h3 .n { font: 600 12px var(--mono); color: var(--ink-3); letter-spacing: 0; }
  .rw { overflow: hidden; }
  .row .t.done { color: var(--ink-3); text-decoration: line-through; }
  .row .ok { font: 600 10.5px var(--mono); color: var(--ok); }
  .duo { display: flex; gap: 10px; }
  .pillx { transition: none; }
  .pill.pulse i { box-shadow: 0 0 0 4px rgba(194, 133, 12, 0.25); }
  .cap { position: absolute; left: 50%; bottom: 16px; translate: -50% 0; padding: 8px 16px; border-radius: 999px; background: var(--ink); color: var(--paper); font: 600 13px var(--sans); white-space: nowrap; }
  .done-line { display: flex; align-items: center; gap: 8px; padding: 8px 12px; border-radius: 12px; background: var(--paper-2); font-size: 12.5px; color: var(--ok); font-weight: 600; }
  .pin { position: absolute; width: 18px; height: 18px; margin: -9px 0 0 -9px; border-radius: 50%; background: var(--ink); box-shadow: 0 0 0 4px #fff, 0 0 0 6px var(--focus); }
  .pin.late { box-shadow: 0 0 0 4px #fff, 0 0 0 6px var(--bad); }
  .ring { position: absolute; width: 60px; height: 60px; margin: -30px 0 0 -30px; border-radius: 50%; border: 2px solid var(--bad); }
</style>
</head>
<body>
<div class="maps">
  <img id="mapA" src="bg-overview.png" />
  <img id="mapB" src="bg-madrid.png" />
</div>
<div id="pins"></div>
<div class="top">
  <span class="brand"><span class="mark"></span>FleetOS</span>
  <span class="crumb">Operação</span>
  <span class="cmd glass">⌕ Procurar ou pedir · J-4171, Tomás, planear amanhã<kbd>⌘K</kbd></span>
  <span class="clock glass"><span id="day">sex 17/10</span> · <b id="clk">06:00</b><em>● ao vivo</em></span>
</div>
<div class="col" id="col"></div>
<div class="cap" id="cap"></div>
<script src="proto.js"></script>
</body>
</html>
